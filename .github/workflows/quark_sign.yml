name: Quark Auto Sign-in

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  quark-sign:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install requests

      - name: Run Quark Sign-in
        run: |
          for i in 1 2 3; do
            if python quark_sign.py; then
              echo "Sign-in succeeded on attempt $i"
              exit 0
            fi
            echo "Sign-in failed on attempt $i"
            if [ $i -lt 3 ]; then
              echo "Waiting 60 seconds before retry..."
              sleep 60
            fi
          done
          echo "All 3 attempts failed"
          exit 1
        env:
          COOKIE_QUARK: ${{ secrets.COOKIE_QUARK }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
