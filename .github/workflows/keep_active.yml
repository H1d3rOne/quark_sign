name: Keep Repository Active

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keep-active:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Keep active
        run: |
          echo "Last active: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > .last_active

      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: keep repository active [skip ci]"
          file_pattern: .last_active
