name: Keep Repository Active

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keep-active:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Update timestamp and commit
        run: |
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          sed -i "s/<!-- LAST_ACTIVE -->.*<!-- \/LAST_ACTIVE -->/<!-- LAST_ACTIVE -->${TIMESTAMP}<!-- \/LAST_ACTIVE -->/" README.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: keep repository active [skip ci]"
          git push
